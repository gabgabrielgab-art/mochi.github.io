<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mochi — Coming Soon</title>
<meta name="description" content="Mochi is a treat line for dogs who deserve the good stuff. Bites, chews, and daily care — coming soon." />
<link rel="icon" type="image/png" href="assets/ballmark-white.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main class="hero-full">
  <div class="video-bg" id="stage" aria-hidden="true">
    <video id="mochi-video" class="mochi-video" muted playsinline preload="auto">
      <source src="assets/mochi-scrub.mp4" type="video/mp4" />
    </video>
    <div class="loading-badge" id="loading-badge">
      <span class="loading-badge-circle">
        <img src="assets/ballmark-yellow.png" alt="" />
      </span>
    </div>
  </div>
  <div class="overlay">
    <header class="topbar">
      <div class="brand-block">
        <img src="assets/wordmark-white.png" alt="Mochi" class="wordmark" />
        <span class="tagline">Bites / Chews / Care</span>
      </div>
      <div class="cta-block">
        <span class="coming-soon">Coming soon</span>
        <span class="join-hint">Join the list below</span>
      </div>
    </header>

    <section class="bottom-block">
      <h1 class="headline">Coming soon.<br />He already knows.</h1>
      <p class="subhead">Bites, chews, and daily care — nothing fancy, nothing weird.</p>

      <div class="divider"></div>

      <form class="signup" id="signup-form">
        <label class="email-label" for="email">Email address — be the first to know</label>
        <div class="signup-row">
          <input class="email-input" id="email" name="email" type="email" placeholder="you@example.com" required />
          <button class="notify-btn" type="submit">Notify me</button>
        </div>
      </form>
      <p class="form-note" id="form-note">No spam, just treats.</p>
    </section>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
